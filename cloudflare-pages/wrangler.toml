# مشروع Cloudflare Pages المستقل للبرنامج: https://rambfe.pages.dev
# (رابط خاص بالبرنامج ومنفصل تماماً عن نطاق quran-halaqat.workers.dev)
name = "rambfe"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "25093de7c2cc4c4695446d99434ed24a"

[[d1_databases]]
binding = "DB"
database_name = "rambfe-db"
database_id = "445cfd63-a8d0-4548-88a4-940d096e472e"

# المزامنة اللحظية (WebSocket) عبر Durable Object في الـ Worker الداخلي rambfe-realtime
[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"
script_name = "rambfe-realtime"

# الذكاء الاصطناعي لقراءة فواتير PDF والصور
[ai]
binding = "AI"
